# SER 플랫폼 기본 설정 — 모드별 네임스페이스. config.py 가 엔진용 평면 키로 변환.
# CLI 인자가 최종 override. (과거 평면 형식 config 도 그대로 읽힘 — 하위호환)

common:                            # ============ 전 모드 공통 ============
  dataset: emotion_style_speech               # 데이터셋 어댑터 id (ser/datasets/<id>.py). 라벨공간·manifest·전사 규칙 결정.
                                   #   새 데이터셋 = ser/datasets/<id>.py 추가 + 이 값 교체 + configs/datasets/<id>.yaml
  backbone: emotion2vec/emotion2vec_plus_large
                                   # 사용할 백본(특징 추출기) 모델 ID. id 안 키워드로 어댑터 자동 선택.
                                   #   emotion2vec/... | microsoft/wavlm-large | facebook/wav2vec2-large-xlsr-53
  head_type: official-frame-mlp    # 분류 head 종류. official-frame-mlp(프레임시퀀스→attention pool→MLP) |
                                   #   custom-frame-mlp | custom-utterance-mlp(이미 pool된 1벡터→MLP)
  hidden_dim: 256                  # head MLP 은닉층 차원 (클수록 표현력↑·과적합 위험↑)
  dropout: 0.2                     # head dropout 비율 (정규화; 0~0.5)
  keep_labels: [0, 1, 2, 6]        # 학습에 쓸 감정 클래스(원본 라벨 ID). [0,1,2,6]=기쁨/슬픔/분노/중립.
                                   #   null 이면 데이터셋 라벨공간 전체. 여기 개수에 맞춰 자동 dense remap.
  device: cuda                     # 학습 장치 (cuda | cpu). cuda 없으면 자동 cpu 폴백.
  seed: 42                         # 랜덤 시드 (데이터 셔플·init 재현성)
  epochs: 100                      # 최대 학습 epoch (early stop 으로 보통 더 일찍 끝남)
  early_stop_patience: 5           # internal_val macroF1 가 N epoch 연속 무개선이면 조기 종료 (0=비활성)
  num_workers: 16                  # DataLoader 병렬 워커 수 (CPU 코어/디스크에 맞춰)
  weight_decay: 1.0e-5             # AdamW weight decay (L2 정규화 강도). 과적합 억제.
  label_smoothing: 0.05            # 정답 라벨을 1.0 대신 0.95로 (과신 방지·일반화↑; 0~0.1)
  use_class_weights: true          # 클래스 불균형 보정 — train 분포 역수로 loss 가중 (소수 클래스 강조)
  amp_dtype: bf16                  # mixed precision dtype (bf16 권장). 백본 forward autocast 에 사용.
  manifest_dir: data/manifests     # split jsonl({split}.jsonl) 들이 있는 디렉토리
  out_dir: checkpoints             # 체크포인트 저장 루트: {out_dir}/{mode}/{timestamp}_{backbone}_{head}/
  eval_on_test: true               # 학습 끝나고 best 모델로 test 평가 + test_logits.npz 저장 여부
  split:                           # 화자+대본 동시 분리 (make_disjoint_split — 음향·텍스트 누수 0). 재생성 금지.
    train: train_di                #   학습 split
    val: val_di                    #   내부 검증(early stop·best 선택) split
    test: test_di                  #   최종 평가(held-out 화자+held-out 대본) split

acoustic:                          # ===== ser.train (raw audio) : full FT & on-the-fly head-only =====
  full_ft_lr: 5.0e-5               # [full FT] head 의 학습률
  full_ft_backbone_lr: 5.0e-6      # [full FT] backbone 의 학습률 (사전학습 보존 위해 head보다 작게)
  head_lr: 5.0e-4                  # [head-only(--embed-on-the-fly)] head 학습률. 백본 동결이라 크게 OK.
  batch_size: 32                   # 배치 크기. full FT(~300M 백본)는 메모리상 32. head-only면 더 키워도 됨.
  warmup_steps: 500                # LR warmup 스텝 수 (0→설정LR 선형 증가 후 cosine 감소). 초반 안정화.
  grad_accum: 1                    # gradient accumulation 스텝. N이면 실효 배치 = batch_size×N (메모리 절약).
  max_audio_sec: 10.0              # 오디오 최대 길이(초). 넘으면 crop (메모리/속도). 16kHz 기준 10s=160k 샘플.
  freeze_cnn: false                # true면 CNN feature extractor만 동결(트랜스포머는 학습). 화자 적을 때 과적합↓.
  freeze_first_n_layers: 0         # >0이면 하위 N개 트랜스포머 블록 추가 동결 (0=동결 안 함)
  gradient_checkpointing: false    # true면 활성값 재계산으로 VRAM 절약(속도 ~20%↓). OOM 날 때만.

cached:                            # ===== ser.train_cached (캐시 임베딩 → head) : 텍스트 / early-fusion =====
  lr: 5.0e-4                       # head 학습률 (백본 없이 head만 학습이라 크게)
  batch_size: 256                  # 배치 크기 (임베딩만 올리니 커도 됨)
